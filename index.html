<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filamenta | Interactive Pitch & Deck</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f2fbf5; /* Soft Mint Green */
            overflow-x: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            position: relative;
            color: #14532d;
        }

        /* Ambient Eco Background Icons */
        .eco-bg {
            position: absolute;
            color: rgba(34, 197, 94, 0.22);
            font-size: 36px;
            user-select: none;
            z-index: 1;
            font-family: monospace;
        }

        .glass-box {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(22, 101, 52, 0.08);
            text-align: center;
            z-index: 10;
            width: 100%;
            max-width: 520px;
            border: 1.5px solid #c7f2d4;
            transition: 0.3s ease;
        }

        .step-counter {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #16a34a;
            margin-bottom: 12px;
            font-weight: 700;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.55rem;
            color: #0f172a;
            margin-bottom: 25px;
            font-weight: 700;
            line-height: 1.35;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .opt-btn {
            background-color: #f8fafc;
            color: #1e293b;
            border: 1.5px solid #dcfce7;
            padding: 14px 18px;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 14px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
            line-height: 1.4;
        }

        .opt-btn:hover {
            background-color: #22c55e;
            color: #ffffff;
            border-color: #22c55e;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(34, 197, 94, 0.25);
        }

        .opt-btn:hover .opt-label {
            background: #ffffff;
            color: #15803d;
        }

        .opt-label {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            margin-right: 14px;
            background: #dcfce7;
            color: #15803d;
            min-width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
            transition: 0.2s ease;
        }

        .action-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            min-height: 90px;
            align-items: center;
            position: relative;
            margin-top: 20px;
        }

        .primary-btn {
            background-color: #16a34a;
            color: #ffffff;
            padding: 13px 35px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 14px;
            border: none;
            font-family: 'Space Grotesk', sans-serif;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 14px rgba(22, 163, 74, 0.25);
        }

        .primary-btn:hover {
            transform: scale(1.05);
            background-color: #15803d;
        }

        #noBtn {
            background-color: #ffffff;
            color: #16a34a;
            position: absolute;
            border: 1.5px solid #86efac;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 14px;
            font-family: 'Space Grotesk', sans-serif;
            cursor: pointer;
            z-index: 100;
            transition: 0.1s ease-out;
        }

        /* Screen Stylings */
        .welcome-screen h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.3rem;
            color: #15803d;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .welcome-screen p {
            color: #475569;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .final-screen h2 {
            font-family: 'Space Grotesk', sans-serif;
            color: #15803d;
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 20px;
        }

        .final-screen hr {
            border: none;
            border-top: 1.5px solid #86efac;
            margin: 20px auto;
            max-width: 220px;
        }

        .final-screen p {
            font-size: 0.95rem;
            color: #166534;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="eco-bg" style="top: 10%; left: 12%;">♻</div>
    <div class="eco-bg" style="top: 20%; right: 15%;">✦</div>
    <div class="eco-bg" style="bottom: 15%; left: 10%;">♻</div>
    <div class="eco-bg" style="bottom: 25%; right: 18%;">⚙</div>
    <div class="eco-bg" style="top: 50%; left: 6%;">✦</div>

    <div class="glass-box" id="mainContainer">
        
        <!-- Screen 1: Welcome to Filamenta -->
        <div id="welcome-section" class="welcome-screen">
            <h2>Welcome to Filamenta ♻️</h2>
            <p>From discarded plastic bottles to high-utility micro-manufactured everyday goods. Scalable, sustainable, and profitable.</p>
            <button class="primary-btn" onclick="startDeck()">Start Exploring</button>
        </div>

        <!-- Screen 2: Interactive Deck Sections -->
        <div id="quiz-section" class="hidden">
            <div class="step-counter" id="stepText">Section 1 of 6</div>
            <h1 id="questionText">Loading...</h1>
            <div class="options-container" id="optionsContainer"></div>
        </div>

        <!-- Screen 3: Action Step -->
        <div id="final-section" class="hidden">
            <h1>Invest in the Closed-Loop Circular Future?</h1>
            <div class="action-area">
                <button class="primary-btn" onclick="revealPitch()">Partner With Us</button>
                <button id="noBtn" onmouseover="moveNo()" onclick="moveNo()">Pass</button>
            </div>
        </div>

        <!-- Screen 4: Final Message -->
        <div id="secret-message" class="hidden final-screen">
            <h2>We plan further business with you 🤝</h2>
            <hr>
            <p><i>random code by Asloo</i></p>
        </div>

    </div>

    <script>
        const sections = [
            { 
                title: "What is Filamenta's Core Innovation?", 
                items: [
                    "Zero raw material cost via collected plastic waste",
                    "Turning local plastic strips into 3D printer filament",
                    "Hyper-local micro-manufacturing for daily utilities",
                    "Closed-loop circular model with zero landfill waste"
                ] 
            },
            { 
                title: "How is the ₹10 Lakhs Capital Allocated?", 
                items: [
                    "₹5,00,000 for 25 FDM 3D Printers & pullers",
                    "₹2,00,000 for collection logistics & prep supplies",
                    "₹1,50,000 for marketing, campus events & branding",
                    "₹1,30,000 for warehouse setup & street drop bins"
                ] 
            },
            { 
                title: "Who are our Primary Customer Segments?", 
                items: [
                    "Gen Z & students buying toys, docks & keychains",
                    "College fests ordering custom bulk badges & gifts",
                    "Wedding organizers looking for sustainable return gifts",
                    "Partnered apartments needing low-cost home utilities"
                ] 
            },
            { 
                title: "What is the Apartment Mutualism Model?", 
                items: [
                    "Apartments supply clean plastic bottles directly",
                    "Branded drop-off bins provided right at their gate",
                    "Residents get home utility goods at discounted rates",
                    "Zero procurement cost with guaranteed repeat orders"
                ] 
            },
            { 
                title: "What is our Target Market Size?", 
                items: [
                    "TAM: ₹15,000+ Cr (Indian recycled consumer goods)",
                    "SAM: ₹150 - ₹200 Cr (South Indian student & fest hubs)",
                    "SOM: ₹30L - ₹60L (Realistic Year 1-2 targets)",
                    "High gross margin driven by free raw material"
                ] 
            },
            { 
                title: "How do we mitigate Operational Risks?", 
                items: [
                    "Strict drying to eliminate moisture & print bubbling",
                    "Consistent strip tolerance control to prevent clogs",
                    "25-printer distributed farm to prevent downtime",
                    "Hardened nozzles built for continuous output"
                ] 
            }
        ];

        let currentStep = 0;
        const labels = ["A", "B", "C", "D"];

        function startDeck() {
            document.getElementById('welcome-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            loadStep();
        }

        function loadStep() {
            if (currentStep < sections.length) {
                const data = sections[currentStep];
                document.getElementById('stepText').innerText = `Section ${currentStep + 1} of ${sections.length}`;
                document.getElementById('questionText').innerText = data.title;
                
                const container = document.getElementById('optionsContainer');
                container.innerHTML = '';

                data.items.forEach((item, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'opt-btn';
                    btn.innerHTML = `<span class="opt-label">${labels[i]}</span> ${item}`;
                    btn.onclick = nextStep;
                    container.appendChild(btn);
                });
            } else {
                document.getElementById('quiz-section').classList.add('hidden');
                document.getElementById('final-section').classList.remove('hidden');
            }
        }

        function nextStep() {
            currentStep++;
            loadStep();
        }

        function moveNo() {
            const btn = document.getElementById('noBtn');
            const padding = 50;
            const maxX = window.innerWidth - btn.offsetWidth - padding;
            const maxY = window.innerHeight - btn.offsetHeight - padding;
            
            btn.style.position = 'fixed';
            btn.style.left = Math.max(15, Math.random() * maxX) + 'px';
            btn.style.top = Math.max(15, Math.random() * maxY) + 'px';
        }

        function revealPitch() {
            document.getElementById('final-section').classList.add('hidden');
            document.getElementById('secret-message').classList.remove('hidden');
        }
    </script>
</body>
</html>
