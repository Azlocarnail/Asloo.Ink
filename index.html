<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ivde Onnulla</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding: 20px;
        }

        .box {
            background-color: #f0f9ff; /* Light Soft Blue */
            border: 1.5px solid #bae6fd; /* Border Light Blue */
            border-radius: 20px;
            padding: 40px 50px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.08);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #0369a1; /* Deep Calm Blue */
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>Ivde onnulla</h1>
    </div>

</body>
</html>
