<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filamenta | Pitch Deck & BMC</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0b130e;
            color: #e5f4ea;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Ambient Eco Glows */
        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 1;
            opacity: 0.25;
            pointer-events: none;
        }
        .glow-1 { width: 320px; height: 320px; background: #22c55e; top: -50px; left: -50px; }
        .glow-2 { width: 350px; height: 350px; background: #15803d; bottom: -50px; right: -50px; }

        .container {
            background-color: #121e17;
            padding: 35px 28px;
            border-radius: 24px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
            text-align: left;
            z-index: 10;
            width: 100%;
            max-width: 520px;
            border: 1px solid #1f3d2a;
            transition: all 0.3s ease-in-out;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #1f3d2a;
            padding-bottom: 12px;
        }

        .brand-tag {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #4ade80;
            text-transform: uppercase;
        }

        .step-counter {
            font-size: 0.85rem;
            font-weight: 600;
            color: #86efac;
            background: rgba(34, 197, 94, 0.12);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .points-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .point-card {
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid #1f3d2a;
            background-color: #17271e;
            color: #d1fae5;
            font-size: 0.95rem;
            line-height: 1.5;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .point-card strong {
            color: #4ade80;
        }

        .point-bullet {
            background: #22c55e;
            color: #052e16;
            min-width: 22px;
            height: 22px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.75rem;
            margin-top: 2px;
        }

        .nav-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 12px;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-next {
            background: #22c55e;
            color: #052e16;
            flex: 1;
        }

        .btn-next:hover {
            background: #4ade80;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3);
        }

        .btn-prev {
            background: #1f3d2a;
            color: #a7f3d0;
        }

        .btn-prev:hover {
            background: #285237;
        }

        /* Summary / Final screen */
        .summary-card {
            text-align: center;
            padding: 20px 10px;
        }

        .summary-card h2 {
            color: #4ade80;
            font-size: 1.8rem;
            margin-bottom: 12px;
        }

        .summary-card p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn-restart {
            background: #22c55e;
            color: #052e16;
            display: inline-block;
            width: 100%;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="container" id="mainBox">
        <div id="deck-content">
            <div class="header-bar">
                <span class="brand-tag">FILAMENTA</span>
                <span class="step-counter" id="step-text">Slide 1 of 5</span>
            </div>
            <h1 id="title-text">Loading...</h1>
            <div class="points-list" id="points-container"></div>
            <div class="nav-actions">
                <button class="btn btn-prev" id="prevBtn" onclick="prevSlide()">Back</button>
                <button class="btn btn-next" id="nextBtn" onclick="nextSlide()">Continue</button>
            </div>
        </div>

        <div id="final-screen" class="hidden summary-card">
            <h2>Ready to Scale!</h2>
            <p>Filamenta combines zero-cost raw plastic waste with localized micro-manufacturing to deliver high-margin, sustainable consumer utilities.</p>
            <button class="btn btn-restart" onclick="restartDeck()">Review Pitch Deck Again</button>
        </div>
    </div>

    <script>
        const deck = [
            {
                title: "The Core Value Proposition",
                points: [
                    "<strong>100% Upcycled Waste:</strong> Transforming discarded PET bottles directly into high-grade 3D printing strips.",
                    "<strong>Zero Raw Material Cost:</strong> Sourced locally, eliminating virgin filament procurement expenses.",
                    "<strong>Affordable Customization:</strong> Fast, on-demand toys, tech docks, and daily utilities with zero minimum order quantities."
                ]
            },
            {
                title: "Customer Segments",
                points: [
                    "<strong>Gen Z & Students:</strong> Aesthetic desk accessories, custom keychains, and fidget toys.",
                    "<strong>College Fests & Events:</strong> Sustainable mementos, participant badges, and bulk merchandise.",
                    "<strong>Residential Communities:</strong> Families seeking durable household utilities through our bottle-exchange program.",
                    "<strong>Local Boutiques & Cafes:</strong> Branded shelf souvenirs, merchandise, and counter displays."
                ]
            },
            {
                title: "Cost Structure (₹10 Lakhs Initial Capital)",
                points: [
                    "<strong>Machinery (₹5,00,000):</strong> 25 FDM 3D Printers (~₹20k each) + strip cutters & extrusion kits.",
                    "<strong>Collection Logistics (₹2,00,000):</strong> Transport runs, sorting supplies, washing, and prep gear.",
                    "<strong>Marketing & Branding (₹1,50,000):</strong> Campus activations, event stalls, and kraft packaging.",
                    "<strong>Facility Setup (₹1,00,000):</strong> Commercial electrical wiring, print racks, and workspace deposit.",
                    "<strong>Branded Street Bins (₹30,000):</strong> Deployed waste collection boxes doubling as street marketing."
                ]
            },
            {
                title: "Targeted Revenue Streams",
                points: [
                    "<strong>Direct-to-Consumer (D2C):</strong> Online catalog sales via Instagram & website (₹49 - ₹299 unit pricing).",
                    "<strong>Event Merchandising:</strong> High-volume bulk orders for college tech/cultural festivals.",
                    "<strong>Wedding & Party Keepsakes:</strong> Customized eco-friendly souvenirs for large celebrations.",
                    "<strong>Apartment Mutualism Model:</strong> Exchanging collected waste plastic for discounted household utilities (10-20% below market price)."
                ]
            },
            {
                title: "Market Size: TAM • SAM • SOM",
                points: [
                    "<strong>TAM (₹15,000+ Cr):</strong> Total Indian market for recycled consumer plastics and customized novelty gifting.",
                    "<strong>SAM (₹150 - ₹200 Cr):</strong> College events, student hubs, and residential societies across South India.",
                    "<strong>SOM (₹30L - ₹60L):</strong> Realistically captured in Year 1-2 across regional campuses and 50+ partnered residential societies."
                ]
            }
        ];

        let currentStep = 0;

        function renderSlide() {
            if (currentStep < deck.length) {
                const data = deck[currentStep];
                document.getElementById('step-text').innerText = `Slide ${currentStep + 1} of ${deck.length}`;
                document.getElementById('title-text').innerText = data.title;
                
                const container = document.getElementById('points-container');
                container.innerHTML = '';

                data.points.forEach((point, i) => {
                    const card = document.createElement('div');
                    card.className = 'point-card';
                    card.innerHTML = `<span class="point-bullet">${i + 1}</span> <span>${point}</span>`;
                    container.appendChild(card);
                });

                document.getElementById('prevBtn').style.visibility = currentStep === 0 ? 'hidden' : 'visible';
                document.getElementById('nextBtn').innerText = currentStep === deck.length - 1 ? 'Finish Review' : 'Continue';
            } else {
                document.getElementById('deck-content').classList.add('hidden');
                document.getElementById('final-screen').classList.remove('hidden');
            }
        }

        function nextSlide() {
            currentStep++;
            renderSlide();
        }

        function prevSlide() {
            if (currentStep > 0) {
                currentStep--;
                renderSlide();
            }
        }

        function restartDeck() {
            currentStep = 0;
            document.getElementById('final-screen').classList.add('hidden');
            document.getElementById('deck-content').classList.remove('hidden');
            renderSlide();
        }

        renderSlide();
    </script>
</body>
</html>
